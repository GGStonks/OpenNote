[package]
name = "opennote_native"
version = "0.1.0"
edition = "2021"

# The Rust code the TypeScript app calls on the devices (iOS shell: static library; Android:
# libopennote_native.so loaded by OpenNoteRustPlugin). See src/lib.rs.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
canvas = { path = "../canvas" }
viewport = { path = "../viewport" }
ink = { path = "../ink" }
model = { path = "../model" }
nib = { path = "../nib" }
renderer = { path = "../renderer" }
shapes = { path = "../shapes" }
ui = { path = "../ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The shells' monotonic clock (lib.rs clock_ms).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

# The JNI entry point (Android). Its own feature so it can be tested from a JVM on the PC
# (crates/native/tests/jni/run.sh); scripts/build-rust.sh turns it on for Android.
jni = { version = "0.21.1", optional = true }

# The Android surface (ANativeWindow_fromSurface) for the native canvas.
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"

[features]
jni = ["dep:jni"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
