[workspace]
members = [
    "spikes/*",
    "crates/*",
]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1

# Pictures decoded in the canvas's tests (a 12000 x 9000 file among them) at a usable speed in
# debug builds: the image codecs and the canvas's own resampling optimised.
[profile.dev.package.canvas]
opt-level = 2
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
